# Uncomment these two line to add support for encoders to your firmware
# CONFIG_EC11=y
# CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# # Uncomment the following line to enable the Kyria OLED Display
# CONFIG_ZMK_DISPLAY=y

# # Uncomment the following lines to enable RGB underglow
# # CONFIG_ZMK_RGB_UNDERGLOW=y
# # CONFIG_WS2812_STRIP=y

# # Set deep sleep to 10 minutes
# CONFIG_ZMK_SLEEP=y
# CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=600000

# # Board name
# CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
# dongle mode
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# display
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_KEYBOARD_NAME="Corne View"
CONFIG_ZMK_IDLE_TIMEOUT=60000

CONFIG_BT_BAS=n
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

CONFIG_PROSPECTOR_STATUS_SCREEN_OPERATOR=y
CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=n
CONFIG_PROSPECTOR_FIXED_BRIGHTNESS=80

# CONFIG_ZMK_DONGLE_DISPLAY_MAC_MODIFIERS=y
# CONFIG_ZMK_DONGLE_DISPLAY_DONGLE_BATTERY=n
# CONFIG_ZMK_DONGLE_DISPLAY_WPM_DISABLED_LAYERS="layers"

# Increase Bluetooth buffer size to avoid GATT ENOMEM on dongle connected to multiple peripherals
CONFIG_BT_BUF_ACL_TX_COUNT=10
CONFIG_BT_L2CAP_TX_BUF_COUNT=10
CONFIG_BT_ATT_TX_COUNT=10
